{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="admin-card border-0 shadow-lg">
            <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white;">
                <h3 class="mb-0 fw-bold">Login</h3>
                <small class="opacity-75">Welcome back to SmartHub</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" style="border-radius: 8px;" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" style="border-radius: 8px;" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="border-radius: 10px; background: #6366f1;">
                        <i class="fas fa-sign-in-alt me-2"></i> Access Dashboard
                    </button>
                    <div class="text-center mt-3">
                        <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-indigo">Register here</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
